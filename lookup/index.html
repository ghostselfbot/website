<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <title>Ghost — Install Lookup</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Look up the latest telemetry status for a Ghost installation.">
        <link rel="canonical" href="https://www.ghostt.cc/lookup/">

        <meta property="og:title" content="Ghost — Install Lookup">
        <meta property="og:description" content="Look up the latest telemetry status for a Ghost installation.">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://www.ghostt.cc/lookup/">

        <link rel="stylesheet" href="/assets/style/style.css">
        <link rel="stylesheet" href="/assets/style/lookup.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://kit.fontawesome.com/e03bde962b.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="navbar sticky-top">
            <div class="custom-container container">
                <div class="row w-100">
                    <div class="col-lg-12 d-flex justify-content-between align-items-center">
                        <div class="navbar-brand-group">
                            <img src="/assets/ghost-2.jpg" class="navbar-logo" alt="Ghost Logo">
                            <a href="/" class="navbar-brand fw-bold">Ghost</a>
                        </div>
                        <div class="navbar-actions">
                            <a href="https://github.com/ghostselfbot/ghost" class="nav-link d-inline-block navbar-social" aria-label="Ghost on GitHub"><i class="fa-brands fa-github"></i></a>
                            <a href="https://discord.gg/ayz7eYvFsm" class="nav-link d-inline-block navbar-social" aria-label="Ghost on Discord"><i class="fa-brands fa-discord"></i></a>
                            <a href="/stats/" class="home-user-pill" aria-label="View Ghost usage statistics"><i class="fa-solid fa-chart-line" aria-hidden="true"></i><span>Stats</span></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <main class="stats-page lookup-page">
            <section class="container custom-container lookup-shell">
                <div class="lookup-intro mb-5">
                    <!-- <p class="stats-card-eyebrow">Telemetry</p> -->
                    <h1 class="stats-title">Installation lookup</h1>
                    <p class="stats-intro">Search for a Ghost install to see its latest reported status.</p>
                </div>

                <section class="stats-card lookup-card">
                    <form id="lookup-form" class="lookup-form" novalidate>
                        <label for="install-id">Install ID</label>
                        <div class="lookup-input-row">
                            <input id="install-id" name="install_id" type="text" autocomplete="off" spellcheck="false" placeholder="cb130e3a-667e-478f-b0f5-89d1e1c78b85" required>
                            <button type="submit" class="btn download-btn lookup-submit"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span>Search</span></button>
                        </div>
                        <p class="lookup-help">Enter your installation ID available in your config file.</p>
                    </form>
                </section>

                <section id="lookup-result" class="stats-card lookup-card lookup-result" aria-live="polite" hidden>
                    <div class="lookup-result-heading">
                        <div>
                            <p class="stats-card-eyebrow">Install status</p>
                            <h2 id="lookup-result-title">Install details</h2>
                        </div>
                        <span id="lookup-status" class="lookup-status"></span>
                    </div>
                    <div id="lookup-details" class="lookup-details"></div>
                </section>

                <div id="lookup-message" class="lookup-message" role="status" hidden></div>
            </section>
        </main>

        <div class="footer">
            <div class="container py-3 text-center">
                <p class="pt-3">&copy; <a href="https://benny.fun/">bennyscripts</a> — 2021-2026</p>
            </div>
        </div>

        <script src="/assets/scripts/lookup.js"></script>
    </body>
</html>
